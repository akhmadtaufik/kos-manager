services:
  db:
    image: postgres:15-alpine
    container_name: kosmanager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-kosmanager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kosmanager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kosmanager-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NUXT_DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-kosmanager}
      - NUXT_AUTH_SECRET=${AUTH_SECRET}
      - NUXT_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - NUXT_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NUXT_PUBLIC_AUTH_ORIGIN=${AUTH_ORIGIN}
      - AUTH_ORIGIN=${AUTH_ORIGIN}
      - NEXTAUTH_URL=${AUTH_ORIGIN}
    networks:
      - kosmanager-network

volumes:
  pgdata:

networks:
  kosmanager-network:
    driver: bridge