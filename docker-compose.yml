services:
  db:
    image: postgres:15-alpine
    container_name: kosmanager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-kosmanager}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kosmanager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kosmanager-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
      # DB: service name 'db' resolves inside Docker bridge network
      NUXT_DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-kosmanager}"
      # AUTH_ORIGIN must be the URL the browser uses (not the container name)
      NUXT_PUBLIC_AUTH_ORIGIN: "${AUTH_ORIGIN:-http://localhost:3000}"
      NUXT_AUTH_SECRET: "${AUTH_SECRET}"
      NUXT_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      NUXT_GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
    networks:
      - kosmanager-network

volumes:
  pgdata:

networks:
  kosmanager-network:
    driver: bridge
